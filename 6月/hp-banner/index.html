<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HPバナー｜JOYFIT24経堂 夏得キャンペーン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-red: #C21632;
            --brand-deep: #9a1028;
            --lp-frame: #1a1a1a;
            --gold-gradient: linear-gradient(120deg, #B48811 0%, #F8E71C 35%, #D4AF37 65%, #F8E71C 100%);
            --cream: #fffdf5;
            --banner-w: 1080px;
            --banner-h: 1020px;
            --s: 1.44; /* 1080 / 750 — デザイン倍率 */
            --stack-gap: calc(20px * var(--s)); /* ブロック間隔を統一 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: #111;
            min-height: 100vh;
            padding: 28px 16px 48px;
        }

        .toolbar {
            max-width: 780px;
            margin: 0 auto 20px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #aaa;
            font-size: 0.8rem;
        }
        .toolbar h1 { font-size: 0.92rem; font-weight: 900; color: #fff; margin-bottom: 6px; }
        .toolbar-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .toolbar-actions button {
            font-family: inherit; font-size: 0.82rem; font-weight: 800;
            padding: 9px 16px; border: none; border-radius: 6px;
            background: var(--brand-red); color: #fff; cursor: pointer;
        }
        .toolbar-actions button.secondary { background: rgba(255,255,255,0.12); }
        .toolbar-status { margin-top: 8px; font-size: 0.75rem; color: #666; }

        .preview-wrap { display: flex; justify-content: center; }

        /* ===== 1080×1020 ===== */
        .export-canvas {
            width: var(--banner-w);
            height: var(--banner-h);
            min-width: var(--banner-w);
            min-height: var(--banner-h);
            max-width: var(--banner-w);
            max-height: var(--banner-h);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            background:
                radial-gradient(ellipse 62% 48% at 50% -8%, rgba(255, 210, 100, 0.28), transparent 55%),
                radial-gradient(ellipse 75% 50% at 50% 0%, rgba(248, 231, 28, 0.1), transparent 58%),
                linear-gradient(180deg, #d41838 0%, var(--brand-red) 45%, var(--brand-deep) 100%);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        }

        .frame-inset {
            position: absolute;
            inset: calc(14px * var(--s));
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }
        .frame-inset::before {
            content: '';
            position: absolute;
            inset: calc(5px * var(--s));
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* 上寄せ＋下余白（CTA用スペース） */
        .canvas-inner {
            position: relative;
            z-index: 1;
            width: var(--banner-w);
            height: var(--banner-h);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: calc(32px * var(--s)) calc(32px * var(--s)) calc(155px * var(--s));
            color: #fff;
            text-align: center;
        }

        .content-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: var(--stack-gap);
        }

        .zone-head {
            width: 100%;
        }

        .headline {
            font-size: calc(62px * var(--s));
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 0.04em;
        }

        .headline-gold {
            display: block;
            background: linear-gradient(120deg, #fff8dc 0%, #F8E71C 35%, #FFC857 65%, #F8E71C 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .headline-sun {
            display: block;
            margin-bottom: calc(6px * var(--s));
            font-size: calc(36px * var(--s));
            color: #FFC857;
            opacity: 0.92;
            filter: drop-shadow(0 2px 8px rgba(255, 180, 60, 0.35));
            line-height: 1;
        }

        .deal-line {
            display: inline-flex;
            align-items: center;
            font-size: calc(42px * var(--s));
            font-weight: 900;
            line-height: 1.25;
            letter-spacing: 0.04em;
            padding: calc(12px * var(--s)) calc(30px * var(--s));
            background: rgba(0, 0, 0, 0.28);
            border: 2px solid rgba(248, 231, 28, 0.55);
            border-radius: 999px;
            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
        }

        .deal-line em {
            font-style: normal;
            display: inline-block;
            margin-left: 0.12em;
            padding: calc(4px * var(--s)) calc(16px * var(--s)) calc(6px * var(--s));
            background: var(--gold-gradient);
            color: var(--lp-frame);
            border-radius: calc(6px * var(--s));
            box-shadow: 0 3px 10px rgba(212, 175, 55, 0.45);
            text-shadow: none;
        }

        .price-block {
            text-align: center;
            line-height: 1;
        }

        .price-line {
            display: inline-flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* 3630 — 立体3D（外枠なし・シンプル） */
        .price-num {
            font-size: calc(192px * var(--s));
            font-weight: 900;
            letter-spacing: 0.04em;
            font-variant-numeric: tabular-nums;
            line-height: 0.92;
            color: #fff;
            text-shadow:
                -1px -1px 0 rgba(255, 255, 255, 0.35),
                1px 1px 0 rgba(0, 0, 0, 0.12),
                2px 2px 0 rgba(0, 0, 0, 0.12),
                3px 3px 0 rgba(0, 0, 0, 0.11),
                4px 4px 0 rgba(0, 0, 0, 0.11),
                5px 5px 0 rgba(0, 0, 0, 0.1),
                6px 6px 0 rgba(0, 0, 0, 0.1),
                7px 7px 0 rgba(0, 0, 0, 0.09),
                8px 8px 0 rgba(0, 0, 0, 0.09),
                9px 9px 0 rgba(0, 0, 0, 0.08),
                10px 10px 0 rgba(0, 0, 0, 0.08),
                11px 11px 0 rgba(0, 0, 0, 0.07),
                12px 12px 0 rgba(0, 0, 0, 0.06),
                0 calc(16px * var(--s)) calc(28px * var(--s)) rgba(0, 0, 0, 0.38);
        }

        .price-yen-col {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-left: calc(8px * var(--s));
            padding-bottom: 0.2em;
        }

        .price-tax {
            font-size: calc(17px * var(--s));
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.78);
            margin-bottom: calc(4px * var(--s));
            white-space: nowrap;
        }

        .price-yen {
            font-size: calc(54px * var(--s));
            font-weight: 900;
            line-height: 1;
        }

        .deadline {
            font-size: calc(34px * var(--s));
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.92);
        }

        .zone-foot {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: var(--stack-gap);
            width: 100%;
        }

        .foot-pill {
            font-size: calc(21px * var(--s));
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: 0.03em;
            padding: calc(13px * var(--s)) calc(24px * var(--s));
            border-radius: calc(8px * var(--s));
            background: var(--cream);
            color: var(--brand-red);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
        }
    </style>
</head>
<body>

<div class="toolbar">
    <h1>HPバナー — 1080×1020</h1>
    <div class="toolbar-actions">
        <button type="button" id="btn-dl-1x">PNG 1080×1020</button>
        <button type="button" id="btn-dl-2x">PNG 2160×2040</button>
        <button type="button" id="btn-dl-3x" class="secondary">PNG 3240×3060</button>
    </div>
    <p class="toolbar-status" id="export-status">フォント読み込み中…</p>
</div>

<div class="preview-wrap">
    <div class="export-canvas" id="export-canvas" role="img" aria-label="まだ間に合う夏得キャンペーン">
        <div class="frame-inset" aria-hidden="true"></div>

        <div class="canvas-inner">
            <div class="content-stack">
                <header class="zone-head">
                    <span class="headline-sun" aria-hidden="true">☀</span>
                    <h1 class="headline">
                        まだ間に合う！
                        <span class="headline-gold">夏得キャンペーン！</span>
                    </h1>
                </header>

                <p class="deal-line">半年間 ずっと<em>お得</em></p>

                <div class="price-block">
                    <div class="price-line">
                        <span class="price-num">3630</span>
                        <span class="price-yen-col">
                            <span class="price-tax">（税込）</span>
                            <span class="price-yen">円</span>
                        </span>
                    </div>
                </div>

                <p class="deadline">7/12(日)まで限定</p>

                <footer class="zone-foot">
                    <span class="foot-pill">6月会費0円</span>
                    <span class="foot-pill" id="banner-option-pill">6・7月オプション0円</span>
                    <span class="foot-pill">先着20名様限定</span>
                    <span class="foot-pill">APP入会最短5分</span>
                </footer>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
<script>
(function () {
    const BANNER_W = 1080;
    const BANNER_H = 1020;
    const canvas = document.getElementById('export-canvas');
    const statusEl = document.getElementById('export-status');

    async function waitForFonts() {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        await new Promise(function (r) { setTimeout(r, 400); });
        statusEl.textContent = '準備完了 — 1080×1020px';
    }

    async function downloadPNG(scale) {
        if (typeof htmlToImage === 'undefined') return;
        statusEl.textContent = '生成中…';
        try {
            const w = BANNER_W * scale;
            const h = BANNER_H * scale;
            const dataUrl = await htmlToImage.toPng(canvas, {
                pixelRatio: scale,
                width: BANNER_W,
                height: BANNER_H,
                cacheBust: true,
                style: {
                    width: BANNER_W + 'px',
                    height: BANNER_H + 'px',
                    margin: '0'
                }
            });
            const a = document.createElement('a');
            a.download = 'joyfit-june-banner-' + w + 'x' + h + '.png';
            a.href = dataUrl;
            a.click();
            statusEl.textContent = '完了 — ' + w + '×' + h + 'px';
        } catch (e) {
            statusEl.textContent = 'エラー: ' + e.message;
        }
    }

    document.getElementById('btn-dl-1x').addEventListener('click', function () { downloadPNG(1); });
    document.getElementById('btn-dl-2x').addEventListener('click', function () { downloadPNG(2); });
    document.getElementById('btn-dl-3x').addEventListener('click', function () { downloadPNG(3); });
    waitForFonts();

    (function initBannerPhase() {
        const SWITCH_AT = new Date('2026-06-25T00:00:00+09:00');
        const FORCE_PHASE_B = true;
        const pill = document.getElementById('banner-option-pill');
        function getPreviewB() {
            const params = new URLSearchParams(window.location.search);
            const q = (params.get('phase') || params.get('campaign') || '').toUpperCase();
            if (q === 'B' || q === '2' || params.get('preview') === '6-25') return true;
            if (q === 'A' || q === '1') return false;
            return null;
        }
        function apply() {
            const preview = getPreviewB();
            const isB = preview !== null ? preview : (FORCE_PHASE_B || Date.now() >= SWITCH_AT.getTime());
            if (pill) pill.hidden = !isB;
        }
        apply();
        setInterval(apply, 30000);
    })();
})();
</script>

</body>
</html>
